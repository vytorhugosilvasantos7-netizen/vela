services:
  - type: web
    name: vela
    runtime: python
    plan: free
    buildCommand: python --version
    startCommand: python server.py
    envVars:
      - key: TRADER_VELAS_HOST
        value: 0.0.0.0
      - key: IMAGE_ANALYSIS_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
